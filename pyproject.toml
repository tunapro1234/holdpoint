[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holdpoint"
version = "0.1.0"
description = "Concrete crack photos to width ranges and a drafted defect report; the element stays on hold until an inspector decides."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "scikit-image>=0.22",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.38", "pypdf>=4.0", "reportlab>=4.0", "openai>=1.40"]
ml = ["torch>=2.3", "torchvision>=0.18", "segmentation-models-pytorch>=0.3.3"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["holdpoint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
